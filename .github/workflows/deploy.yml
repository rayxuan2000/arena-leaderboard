name: Update Leaderboard & Deploy

on:
  push:
    branches: [main]
  schedule:
    # 北京时间每日 06:23 = UTC 22:23。
    # 注意：GitHub Actions 的 schedule 是「尽力而为」，高峰期会被排队延迟甚至丢弃。
    # 官方文档点名 UTC 整点（每小时 :00）和 UTC 午夜前后是最拥堵的时段。
    # 旧值 '55 0'(=UTC 00:55) 同时踩中这两个坑：紧贴 01:00 整点 + UTC 午夜的全球
    # 日更 cron 洪峰，因此常被推迟到北京下午才真正执行（页面显示的就是真实执行时间）。
    # 现改到 UTC 22:23：远离整点、远离午夜洪峰，且预留缓冲——即便漂移半小时到一小时，
    # 仍能在北京早晨上班前完成刷新。无法精确命中某一分钟是 GitHub cron 的固有限制。
    - cron: '23 22 * * *'
  workflow_dispatch:

permissions:
  contents: write   # 需要写权限以便把每日 data/ 提交回仓库
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape arena.ai directly
        run: python scripts/fetch_arena.py --out-dir data --allow-jina

      - name: Validate scraped data
        run: python scripts/validate_data.py --data-dir data

      - name: Generate Excel
        run: python scripts/export_arena_excel.py --output arena_leaderboard.xlsx

      - name: Build HTML site
        run: python build_site.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 提交每日榜单数据与厂商图标缓存（logos_cache.json），后者让下次构建免重抓官网
          git add data/
          # 仅在有变化时提交；用默认 GITHUB_TOKEN 推送，不会再触发本工作流（防递归）
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: daily data update ($(date -u +%F)) [skip ci]"
            git push origin HEAD:main
          fi

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp arena_leaderboard.xlsx _site/ 2>/dev/null || true
          cp data/*.json _site/data/ 2>/dev/null || true
          rm -f _site/data/logos_cache.json   # 图标缓存非榜单数据，不对外暴露

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
